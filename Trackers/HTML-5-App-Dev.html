<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HTML 5 App Development</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()">🌙</button>
  <h1>HTML 5 App Development</h1>

  <!-- Progress Wheel -->
  <div class="progress-wheel-container">
    <div class="progress-wheel">
      <svg>
        <circle class="bg" cx="70" cy="70" r="60"></circle>
        <circle class="progress" cx="70" cy="70" r="60"></circle>
      </svg>
      <div class="progress-text" id="progressPercent">0%</div>
    </div>
  </div>

  <!-- Ownership info -->
  <div class="owner">
    Made By: <a href="https://orion021.github.io/krishnan_t/" target="_blank">Orion021</a>
  </div>

  <div id="topics-container"></div>

  <!-- Back to Top Button -->
  <button id="backToTop" onclick="scrollToTop()">↑</button>

  <script>
    const sections = {
    /**
     * Level 1: Core concepts, process, and developer tools.
     */
    "Fundamentals_And_Process": [
        "What is the Internet & How It Works",
        "What is the Web? (WWW)",
        "How Websites Work (Client, Server, Hosting)",
        "DNS & Domain Names",
        "What is HTTP & HTTPS",
        "Basics of URLs",
        "Frontend vs. Backend",
        "Web Browsers & How They Render Pages",
        "Developer Tools (VS Code, Browser DevTools)",
        "Application Lifecycle Stages (Plan, Design, Develop, Test, Deploy, Maintain)",
        "Debugging & Testing (Breakpoints, Console, Unit vs. Functional)",
    ],

    /**
     * Level 2: The structure and 'skeleton' of the application.
     */
    "HTML": [
        "HTML Document Structure (Doctype, html, head, body)",
        "Headings & Paragraphs",
        "Links (Anchor Tags)",
        "Images (img, picture, srcset)",
        "Lists (Ordered, Unordered, Definition)",
        "Tables (table, tr, th, td, tbody, thead)",
        "Semantic Tags (header, nav, main, section, article, aside, footer)",
        "Media Elements (audio, video)",
        "Iframes",
        "Meta Tags (charset, viewport, description)",
        "HTML Forms (form, input, label, button, textarea, select, option)",
        "Advanced Form Elements (datalist, fieldset, legend, meter, output)",
        "Form Validation Attributes (required, min, max, step, pattern)",
        "Data Attributes (data-*)",
        "ARIA Roles & Accessibility Basics",
        "SEO-Friendly Markup",
    ],

    /**
     * Level 3: The visual styling, layout, and responsiveness.
     */
    "CSS": [
        "CSS Syntax & Linking",
        "Selectors (Basic, Combinators, Pseudo-classes, Pseudo-elements, Attribute)",
        "Colors & Units (px, em, rem, %, vw, vh)",
        "The Box Model (margin, padding, border, box-sizing)",
        "Typography (font-family, font-size, font-weight, @font-face, WOFF)",
        "Positioning (static, relative, absolute, fixed, sticky)",
        "Content Flow (display: block/inline/inline-block, float, clear)",
        "Overflow (visible, scroll, hidden, auto)",
        "Layout: Flexbox (Containers & Items)",
        "Layout: Grid (Containers, Templates, Gaps)",
        "Responsive Design & Media Queries",
        "CSS Variables (Custom Properties)",
        "Custom Fonts & Icon Fonts",
    ],

    /**
     * Level 4: Enhancing the UI with graphics and motion.
     */
    "Graphics_And_Animation": [
        "Graphics: canvas (2D Drawing, Transformations, Interactivity)",
        "Graphics: svg (Shapes, Paths, Fills, Inline vs. File)",
        "CSS Transforms (2D & 3D: translate, rotate, scale, skew)",
        "CSS Transitions (for smooth state changes)",
        "CSS Keyframe Animations (@keyframes, animation)",
        "CSS Filters (blur, grayscale, sepia, drop-shadow, saturate)",
        "SVG Filters",
        "Graphic Effects (border-radius, box-shadow, opacity, gradients)",
    ],

    /**
     * Level 5: Core interactivity and logic.
     */
    "JavaScript_Core": [
        "JS Basics (Syntax, Comments, Logging)",
        "Variables (let, const, var, scope)",
        "Data Types (Primitives & Objects)",
        "Operators (Arithmetic, Comparison, Logical, Ternary)",
        "Conditional Statements (if/else, switch)",
        "Loops (for, while, do...while)",
        "Functions (Declaration, Expression, Arrow Functions)",
        "Arrays (Creation, Methods, Iteration: forEach)",
        "Objects (Literals, Properties, Methods, 'this' keyword)",
        "DOM Selection (querySelector, querySelectorAll, getElementById)",
        "DOM Manipulation (textContent, innerHTML, style, attributes, classList)",
        "DOM Creation (createElement, append, remove)",
        "Event Handling (addEventListener, removeEventListener)",
        "The Event Object (event.target, event.preventDefault)",
        "Event Bubbling & Capturing",
        "Timers (setTimeout, setInterval, clearInterval)",
    ],

    /**
     * Level 6: Building a complete, modern application (SPA).
     */
    "JavaScript_Advanced_SPA": [
        "ES6+ Features (Destructuring, Spread/Rest, Template Literals)",
        "Advanced Array Methods (.map, .filter, .find, .reduce)",
        "OOP in JS (class, constructor, methods, inheritance with 'extends')",
        "JavaScript Modules (import / export)",
        "Asynchronous JS (Callbacks, Promises, .then/.catch)",
        "Async/Await Syntax",
        "APIs (Fetch) & Data Access (GET, POST, PUT, DELETE)",
        "Data Formats (JSON.parse, JSON.stringify, XML)",
        "Error Handling (try...catch)",
        "State Management (Session State vs. App State)",
        "Vanilla JS State Pattern (Global state object + Render function)",
        "Web Storage (localStorage, sessionStorage)",
        "Client-Side Routing (History API: pushState, popstate)",
        "Browser APIs (Geolocation)",
        "3rd Party APIs & Libraries (e.g., Google Charts, jQuery)",
    ]
    };

    const container = document.getElementById('topics-container');

    Object.entries(sections).forEach(([section, topics]) => {
      const sectionEl = document.createElement('div');
      sectionEl.innerHTML = `<h2>${section} <button class="clear-button" onclick="clearSection('${section}')">Clear All</button></h2>`;
      const listEl = document.createElement('ul');

      topics.forEach((topic, index) => {
        const topicId = `${section}-${index}`;
        const li = document.createElement('li');
        li.innerHTML = `<span class="topic-text">${topic}</span>
          <div class="progress-selector">
            <input type="checkbox" data-id="${topicId}" onclick="setProgress('${topicId}', this.checked)">
          </div>`;
        listEl.appendChild(li);
      });

      sectionEl.appendChild(listEl);
      container.appendChild(sectionEl);
    });

    function setProgress(id, checked) {
      localStorage.setItem(id, checked ? '1' : '0');
      updateOverallProgress();
    }

    function clearSection(section) {
      const topics = sections[section];
      topics.forEach((_, index) => {
        const topicId = `${section}-${index}`;
        localStorage.removeItem(topicId);
        const checkbox = document.querySelector(`input[data-id='${topicId}']`);
        if (checkbox) checkbox.checked = false;
      });
      updateOverallProgress();
    }

    function restoreProgress() {
      Object.entries(sections).forEach(([section, topics]) => {
        topics.forEach((_, index) => {
          const topicId = `${section}-${index}`;
          const saved = localStorage.getItem(topicId);
          const checkbox = document.querySelector(`input[data-id='${topicId}']`);
          if (checkbox && saved === '1') checkbox.checked = true;
        });
      });
      updateOverallProgress();
    }

    function updateOverallProgress() {
      const allTopics = [];
      Object.entries(sections).forEach(([section, topics]) => {
        topics.forEach((_, index) => {
          const topicId = `${section}-${index}`;
          const checked = localStorage.getItem(topicId) === '1' ? 1 : 0;
          allTopics.push(checked);
        });
      });

      const maxScore = allTopics.length;
      const currentScore = allTopics.reduce((a, b) => a + b, 0);
      const percent = maxScore ? Math.round((currentScore / maxScore) * 100) : 0;

      const circle = document.querySelector('.progress');
      const text = document.getElementById('progressPercent');
      const radius = 60;
      const circumference = 2 * Math.PI * radius;
      const offset = circumference - (percent / 100) * circumference;

      circle.style.strokeDasharray = circumference;
      circle.style.strokeDashoffset = offset;
      text.textContent = `${percent}%`;
    }

    function toggleTheme() {
      const root = document.documentElement;
      const isDark = root.classList.toggle('dark-mode');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      document.getElementById('themeToggle').textContent = isDark ? '☀️' : '🌙';
    }

    function restoreTheme() {
      const savedTheme = localStorage.getItem('theme');
      const isDark = savedTheme === 'dark';
      if (isDark) document.documentElement.classList.add('dark-mode');
      document.getElementById('themeToggle').textContent = isDark ? '☀️' : '🌙';
    }

    // Back to Top Logic
    const backToTopBtn = document.getElementById('backToTop');
    window.onscroll = function() {
      if (document.body.scrollTop > 200 || document.documentElement.scrollTop > 200) {
        backToTopBtn.style.display = "block";
      } else {
        backToTopBtn.style.display = "none";
      }
    };

    function scrollToTop() {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    restoreTheme();
    restoreProgress();
  </script>
</body>
</html>
