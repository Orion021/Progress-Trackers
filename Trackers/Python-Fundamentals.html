<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Python Fundamentals</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()">🌙</button>
  <h1>Python Fundamentals</h1>

  <!-- Progress Wheel -->
  <div class="progress-wheel-container">
    <div class="progress-wheel">
      <svg>
        <circle class="bg" cx="70" cy="70" r="60"></circle>
        <circle class="progress" cx="70" cy="70" r="60"></circle>
      </svg>
      <div class="progress-text" id="progressPercent">0%</div>
    </div>
  </div>

  <!-- Ownership info -->
  <div class="owner">
    Made By: <a href="https://orion021.github.io/krishnan_t/" target="_blank">Orion021</a>
  </div>

  <div id="topics-container"></div>

  <!-- Back to Top Button -->
  <button id="backToTop" onclick="scrollToTop()">↑</button>

  <script>
    const sections = {
      "Introduction": [
        "History of Python",
        "Features of Python",
        "Applications of Python",
        "Python 2 vs Python 3",
        "Advantages & Disadvantages of Python"
      ],
      "Installation & Setup": [
        "Installing Python (Windows, Linux, macOS)",
        "Verifying installation",
        "Setting environment variables",
        "Python interpreters (CPython, PyPy, Jython, IronPython)",
        "Python IDEs: IDLE, VS Code, PyCharm, Jupyter Notebook, Spyder",
        "Running scripts vs interactive shell",
        "Introduction to Jupyter Notebook cells and magic commands"
      ],
      "Python Syntax": [
        "Python program structure",
        "Statements vs expressions",
        "Indentation rules",
        "Single-line & multi-line statements",
        "Comments: single-line and multi-line",
        "Docstrings"
      ],
      "Keywords & Identifiers": [
        "Python keywords",
        "Rules for identifiers",
        "Naming conventions",
        "Reserved words",
        "Valid and invalid variable names"
      ],
      "Variables": [
        "Declaring and initializing variables",
        "Dynamic typing",
        "Multiple assignment",
        "Swapping variables",
        "Constants (by convention)"
      ],
      "Data Types": [
        "Numeric types: int, float, complex",
        "Boolean type: bool",
        "Text type: str",
        "NoneType",
        "Type conversion / casting",
        "Type checking: type() function",
        "Mutable vs immutable types"
      ],
      "Operators": [
        "Arithmetic operators: +, -, *, /, //, %, **",
        "Assignment operators: =, +=, -=, *=, /=",
        "Comparison operators: ==, !=, <, >, <=, >=",
        "Logical operators: and, or, not",
        "Bitwise operators: &, |, ^, ~, <<, >>",
        "Membership operators: in, not in",
        "Identity operators: is, is not",
        "Operator precedence and associativity"
      ],
      "Input & Output": [
        "input() function",
        "Reading different types of input",
        "print() function",
        "Formatting outputs: concatenation, .format(), f-strings",
        "sep and end parameters",
        "Multi-line printing"
      ],
      "Conditional Statements": [
        "if statement",
        "if-else statement",
        "if-elif-else ladder",
        "Nested if statements",
        "Boolean evaluation",
        "Short-circuit evaluation"
      ],
      "Loops": [
        "for loop with range() and iterables",
        "while loop",
        "Nested loops",
        "break, continue, pass statements",
        "else clause with loops"
      ],
      "Functions": [
        "Defining functions with def",
        "Function arguments: positional, keyword, default, *args, **kwargs",
        "Return statements",
        "Docstrings in functions",
        "Calling functions",
        "Scope: local, global, nonlocal"
      ],
      "Built-in Functions": [
        "Type-related: type(), isinstance(), id()",
        "Conversion: int(), float(), str(), bool()",
        "Math-related: abs(), round(), pow(), divmod()",
        "Sequence-related: len(), min(), max(), sum(), sorted(), reversed()",
        "Utility: range(), enumerate(), zip(), all(), any()"
      ],
      "Strings": [
        "String creation and literals",
        "Indexing & slicing",
        "Concatenation and repetition",
        "Immutability",
        "String methods: upper(), lower(), title(), capitalize(), find(), index(), count(), replace(), strip(), split(), join()",
        "Escape sequences: \\n, \\t, \\\\, \\\', \\\"",
        "String formatting: %, .format(), f-strings"
      ],
      "Lists": [
        "Creating lists",
        "Indexing & slicing",
        "Adding elements: append(), extend(), insert()",
        "Removing elements: remove(), pop(), clear()",
        "Updating elements",
        "Nested lists (2D lists)",
        "List methods: sort(), reverse(), copy()",
        "List comprehensions"
      ],
      "Tuples": [
        "Creating tuples",
        "Indexing & slicing",
        "Immutability",
        "Tuple packing and unpacking",
        "Nested tuples",
        "Use cases of tuples"
      ],
      "Sets": [
        "Creating sets: set(), {}",
        "Adding/removing elements: add(), update(), remove(), discard(), pop()",
        "Set operations: union, intersection, difference, symmetric difference",
        "Frozenset"
      ],
      "Dictionaries": [
        "Creating dictionaries",
        "Accessing, updating, deleting elements",
        "Nested dictionaries",
        "Dictionary methods: get(), keys(), values(), items(), update(), pop(), clear()",
        "Dictionary comprehensions"
      ],
      "Iterables & Iterators": [
        "Iterables: lists, tuples, strings",
        "Iterators: iter(), next()",
        "Using for loops on iterables",
        "Introduction to generators: yield"
      ],
      "Object-Oriented Programming (OOP)": [
        "Classes and objects",
        "Attributes and methods",
        "Constructors (__init__ method)",
        "Instance, class, and static variables/methods",
        "Encapsulation: public, protected, private",
        "Inheritance: single, multiple, multilevel",
        "Polymorphism: method overriding, operator overloading",
        "Abstract classes (abc module)"
      ],
      "Projects": [
        "Calculator program",
        "Number guessing game",
        "Simple menu-driven program",
        "Basic input/output programs",
        "Simple banking system with accounts and transactions",
        "Student marks management system",
        "To-do list CLI application",
        "Simple text-based game (like Rock-Paper-Scissors)",
        "Library management system",
        "Mini grade calculator"
      ]
    };

    const container = document.getElementById('topics-container');

    Object.entries(sections).forEach(([section, topics]) => {
      const sectionEl = document.createElement('div');
      sectionEl.innerHTML = `<h2>${section} <button class="clear-button" onclick="clearSection('${section}')">Clear All</button></h2>`;
      const listEl = document.createElement('ul');

      topics.forEach((topic, index) => {
        const topicId = `${section}-${index}`;
        const li = document.createElement('li');
        li.innerHTML = `<span class="topic-text">${topic}</span>
          <div class="progress-selector">
            <input type="checkbox" data-id="${topicId}" onclick="setProgress('${topicId}', this.checked)">
          </div>`;
        listEl.appendChild(li);
      });

      sectionEl.appendChild(listEl);
      container.appendChild(sectionEl);
    });

    function setProgress(id, checked) {
      localStorage.setItem(id, checked ? '1' : '0');
      updateOverallProgress();
    }

    function clearSection(section) {
      const topics = sections[section];
      topics.forEach((_, index) => {
        const topicId = `${section}-${index}`;
        localStorage.removeItem(topicId);
        const checkbox = document.querySelector(`input[data-id='${topicId}']`);
        if (checkbox) checkbox.checked = false;
      });
      updateOverallProgress();
    }

    function restoreProgress() {
      Object.entries(sections).forEach(([section, topics]) => {
        topics.forEach((_, index) => {
          const topicId = `${section}-${index}`;
          const saved = localStorage.getItem(topicId);
          const checkbox = document.querySelector(`input[data-id='${topicId}']`);
          if (checkbox && saved === '1') checkbox.checked = true;
        });
      });
      updateOverallProgress();
    }

    function updateOverallProgress() {
      const allTopics = [];
      Object.entries(sections).forEach(([section, topics]) => {
        topics.forEach((_, index) => {
          const topicId = `${section}-${index}`;
          const checked = localStorage.getItem(topicId) === '1' ? 1 : 0;
          allTopics.push(checked);
        });
      });

      const maxScore = allTopics.length;
      const currentScore = allTopics.reduce((a, b) => a + b, 0);
      const percent = maxScore ? Math.round((currentScore / maxScore) * 100) : 0;

      const circle = document.querySelector('.progress');
      const text = document.getElementById('progressPercent');
      const radius = 60;
      const circumference = 2 * Math.PI * radius;
      const offset = circumference - (percent / 100) * circumference;

      circle.style.strokeDasharray = circumference;
      circle.style.strokeDashoffset = offset;
      text.textContent = `${percent}%`;
    }

    function toggleTheme() {
      const root = document.documentElement;
      const isDark = root.classList.toggle('dark-mode');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      document.getElementById('themeToggle').textContent = isDark ? '☀️' : '🌙';
    }

    function restoreTheme() {
      const savedTheme = localStorage.getItem('theme');
      const isDark = savedTheme === 'dark';
      if (isDark) document.documentElement.classList.add('dark-mode');
      document.getElementById('themeToggle').textContent = isDark ? '☀️' : '🌙';
    }

    // Back to Top Logic
    const backToTopBtn = document.getElementById('backToTop');
    window.onscroll = function() {
      if (document.body.scrollTop > 200 || document.documentElement.scrollTop > 200) {
        backToTopBtn.style.display = "block";
      } else {
        backToTopBtn.style.display = "none";
      }
    };

    function scrollToTop() {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    restoreTheme();
    restoreProgress();
  </script>
</body>
</html>
